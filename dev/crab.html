<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>crab studio</title>
    <style>
      body { margin: 0; background: #1a1512; overflow: hidden; color: #f3e6c8; font: 13px/1.35 system-ui, sans-serif; }
      #panel { position: absolute; left: 12px; top: 12px; background: rgba(20, 14, 10, 0.78); border: 1px solid #6b5330;
        border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; z-index: 2; }
      #panel button { background: #3a2a1a; color: #f3e6c8; border: 1px solid #8a6a3a; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
      #panel .v { min-width: 120px; }
      #stats { position: absolute; right: 12px; top: 12px; background: rgba(0, 0, 0, 0.55); padding: 6px 10px; border-radius: 6px; z-index: 2; white-space: pre; font: 12px/1.3 ui-monospace, monospace; }
      .label { position: absolute; transform: translate(-50%, 0); color: #fff4d6; font: 600 15px/1.2 Georgia, serif; text-shadow: 0 1px 2px #000, 0 0 8px #000; pointer-events: none; z-index: 1; white-space: nowrap; }
      body.clean #panel, body.clean #stats { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="./crab.ts"></script>
  </body>
</html>
