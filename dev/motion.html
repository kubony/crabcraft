<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; font: 13px/1.35 system-ui, sans-serif; color: #e8e4da; }
  #app { position: fixed; inset: 0; }
  #ui { position: fixed; left: 12px; top: 12px; bottom: 12px; width: 300px; overflow-y: auto; background: rgba(16,18,22,.86);
        border: 1px solid #3a3426; border-radius: 8px; padding: 10px 12px; box-sizing: border-box; }
  #ui h1 { font-size: 15px; margin: 0 0 2px; color: #f1d58a; letter-spacing: .02em; }
  #ui .sub { color: #9a948a; font-size: 11px; margin-bottom: 8px; }
  #ui h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #b8a77a; margin: 10px 0 4px; }
  .clips { display: flex; flex-wrap: wrap; gap: 4px; }
  .clips button, .row button { background: #2a2620; color: #eee3c7; border: 1px solid #4a4130; border-radius: 4px; padding: 3px 7px;
        font: inherit; font-size: 12px; cursor: pointer; }
  .clips button.on { background: #7a2a22; border-color: #c4553f; color: #fff; }
  .clips button .src { color: #c9b98f; font-size: 10px; margin-left: 3px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .row label { min-width: 62px; color: #b0a996; }
  .row input[type=range] { flex: 1; }
  .row output { width: 38px; text-align: right; color: #ddd; font-variant-numeric: tabular-nums; }
  #weights { font: 11px/1.4 ui-monospace, monospace; color: #c8d6c2; white-space: pre; }
  #timeline { position: fixed; left: 330px; right: 16px; bottom: 16px; height: 54px; background: rgba(16,18,22,.86);
        border: 1px solid #3a3426; border-radius: 8px; padding: 6px 10px; box-sizing: border-box; }
  #tl-title { font-size: 12px; color: #f1d58a; }
  #tl-track { position: relative; height: 22px; margin-top: 4px; background: #1d1c19; border-radius: 3px; cursor: pointer; }
  #tl-head { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #ffd27a; }
  .ev { position: absolute; top: 2px; bottom: 2px; width: 2px; border-radius: 1px; }
  .ev-label { position: absolute; top: -14px; font-size: 9px; color: #c9b98f; transform: translateX(-50%); white-space: nowrap; }
  #log { position: fixed; right: 16px; top: 12px; width: 220px; font: 11px/1.45 ui-monospace, monospace; color: #e8d9a8;
        background: rgba(16,18,22,.7); border-radius: 6px; padding: 6px 8px; min-height: 20px; white-space: pre; }
  #hint { position: fixed; right: 16px; top: 120px; width: 220px; font-size: 11px; color: #9a948a; }
  body.hideui #ui, body.hideui #log, body.hideui #hint { display: none; }
  body.hideui #timeline { left: 16px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<div id="timeline"><div id="tl-title">no action</div><div id="tl-track"><div id="tl-head"></div></div></div>
<div id="log"></div>
<div id="hint">WASD walk and strafe, Q/E turn, Shift run, Space jump, 1-4 gestures, F cast while walking, drag to orbit, wheel to zoom.</div>
<script type="module" src="./motion/main.ts"></script>
</body>
</html>
