<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Mode harness</title>
    <link rel="stylesheet" href="/src/ui/theme.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import '../src/ui/kit.css';
      import { startRobotMode } from '../src/robot/index.ts';
      const params = new URLSearchParams(location.search);
      const robot = await startRobotMode(document.getElementById('app'), { hud: params.get('hud') !== '0' });
      window.robot = robot;
      // Ready for a screenshot once the policy is running and a few frames are on screen.
      const off = robot.onState((s) => {
        if (s.runningPolicy && s.simTime > 1.5) {
          off();
          setTimeout(() => (window.__ready = true), 1200);
        }
      });
    </script>
  </body>
</html>
